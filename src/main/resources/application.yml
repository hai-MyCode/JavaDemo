server:
  port: 8080

logging:
  level:
    root: info
    csc.zjzw.csc: debug
#    csc.zjzw.csc.mapper: info
  file:
    name: logs/csc.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

spring:
  application:
    name: csc

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true'
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}

mybatis-plus:
  configuration:
    # 打印真正执行的 SQL 到控制台（学习阶段必开）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  # ⚠️ 至少 32 字节（HS256 的硬性要求），生产环境必须用环境变量覆盖
  secret: ${JWT_SECRET:csc-local-dev-secret-key-change-me-in-production-32bytes}
  # Token 有效期（分钟）
  expire-minutes: 120